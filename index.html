<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitácora SOC</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      /* Forzar fondo oscuro independiente del tema del navegador */
      html, body {
        background: #070D1F !important;
        color-scheme: dark;
      }

      #root { display: none; }

      #login-overlay {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        inset: 0;
        background: #070D1F;
        z-index: 9999;
        font-family: sans-serif;
      }
      #login-overlay img { width: 200px; margin-bottom: 8px; }
      #login-overlay .subtitle {
        color: #7B93BC; font-size: 12px; margin-bottom: 40px;
        letter-spacing: 0.1em; text-transform: uppercase;
      }
      #login-box {
        background: #0D1630; border: 1px solid #1E3060;
        border-radius: 12px; padding: 32px;
        width: 100%; max-width: 360px;
      }
      #login-box h2 {
        color: #E2E8F0; font-size: 18px; margin-bottom: 24px;
        text-align: center; font-weight: 500;
      }
      #login-box label {
        display: block; color: #7B93BC; font-size: 11px;
        text-transform: uppercase; letter-spacing: 0.05em;
        margin-bottom: 4px; margin-top: 16px;
      }
      #login-box input {
        width: 100%; padding: 10px 14px; background: #0A1428;
        border: 1px solid #1E3060; border-radius: 6px;
        color: #E2E8F0; font-size: 14px; outline: none;
      }
      #login-box input:focus { border-color: #2563EB; }
      #login-submit {
        width: 100%; margin-top: 24px; padding: 12px;
        background: #1E40AF; color: #fff; border: none;
        border-radius: 8px; font-size: 15px; cursor: pointer;
        transition: background 0.2s; letter-spacing: 0.05em;
      }
      #login-submit:hover { background: #2563EB; }
      #login-submit:disabled { background: #4A6490; cursor: not-allowed; }
      #login-error {
        color: #EF4444; font-size: 12px; margin-top: 12px;
        text-align: center; display: none;
      }

      /* Fondo oscuro forzado */
    </style>
  </head>
  <body>
    <!-- Overlay de login -->
    <div id="login-overlay">
      <p class="subtitle">Security Operations Center</p>
      <div id="login-box">
        <h2>Iniciar sesión</h2>
        <label>Correo electrónico</label>
        <input type="email" id="login-email" placeholder="correo@ejemplo.com"/>
        <label>Contraseña</label>
        <input type="password" id="login-password" placeholder="••••••••"/>
        <button id="login-submit" onclick="handleLogin()">Entrar</button>
        <p id="login-error">Correo o contraseña incorrectos. Intenta de nuevo.</p>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      function showApp() {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("root").style.display = "block";
        var lb = document.getElementById("logout-btn"); if (lb) lb.style.display = "block";
      }

      function showLogin() {
        document.getElementById("login-overlay").style.display = "flex";
        document.getElementById("root").style.display = "none";
        var lb = document.getElementById("logout-btn"); if (lb) lb.style.display = "none";
        document.getElementById("login-email").value = "";
        document.getElementById("login-password").value = "";
        document.getElementById("login-error").style.display = "none";
        document.getElementById("login-submit").disabled = false;
        document.getElementById("login-submit").textContent = "Entrar";
      }

      function handleLogin() {
        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;
        const btn = document.getElementById("login-submit");
        const err = document.getElementById("login-error");

        if (!email || !password) return;

        btn.disabled = true;
        btn.textContent = "Verificando...";
        err.style.display = "none";

        fetch("/.netlify/functions/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password })
        })
        .then(function(res) {
          if (!res.ok) throw new Error("Credenciales incorrectas");
          return res.json();
        })
        .then(function(data) {
          localStorage.setItem("bitacora_token", data.token);
          localStorage.setItem("bitacora_user", email);
          showApp();
        })
        .catch(function() {
          err.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Entrar";
        });
      }

      function handleLogout() {
        localStorage.removeItem("bitacora_token");
        localStorage.removeItem("bitacora_user");
        showLogin();
      }

      // Login con Enter
      document.addEventListener("keydown", function(e) {
        if (e.key === "Enter") handleLogin();
      });

      // Verificar si ya hay sesión activa
      window.addEventListener("load", function() {
        const token = localStorage.getItem("bitacora_token");
        if (token) {
          showApp();
        } else {
          showLogin();
        }
      });
    </script>
  </body>
</html>
